<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Funbox 陀螺抽選 連結整理</title>
<style>
  :root{
    --green:#06c755; --green-d:#04a445; --navy:#1f3f66; --gray:#9aa3ab;
    --bg:#f2f4f7; --card:#fff; --line:#e6e9ed; --txt:#222; --sub:#6b7480;
    --warn:#e8590c; --tap:44px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--txt); font-size:15px; line-height:1.5;
    padding:0 0 88px; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px; margin:0 auto; padding:0 12px;}

  /* ---------- 頂部 ---------- */
  header{background:var(--navy); color:#fff; padding:14px 12px 12px;}
  header .wrap{padding:0;}
  h1{margin:0; font-size:17px; font-weight:700; letter-spacing:.3px;}
  .notice{margin:6px 0 0; font-size:12.5px; color:#c8d6e8;}
  .notice b{color:#ffd866;}

  /* ---------- 分頁 ---------- */
  nav.tabs{display:flex; gap:6px; margin:12px 0 10px; overflow-x:auto; padding-bottom:2px;}
  nav.tabs button{
    flex:0 0 auto; min-height:38px; padding:8px 16px; border:0; border-radius:19px;
    background:#e2e6ea; color:#49515a; font-size:14px; font-weight:700; cursor:pointer;
  }
  nav.tabs button[aria-selected="true"]{background:var(--navy); color:#fff;}

  /* ---------- 工具列 ---------- */
  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px;}
  .searchrow{display:flex; gap:8px; align-items:center;}
  .search{
    flex:1 1 auto; min-width:0; min-height:var(--tap); padding:10px 12px; font-size:16px;
    border:1.5px solid #d3d8de; border-radius:10px; background:#fff; color:var(--txt);
  }
  .search:focus{outline:none; border-color:var(--green);}
  .clearbtn{
    flex:0 0 auto; min-height:var(--tap); min-width:var(--tap); border:1.5px solid #d3d8de;
    background:#fff; border-radius:10px; font-size:18px; color:var(--sub); cursor:pointer;
  }
  .hint{font-size:12px; color:var(--sub); margin:8px 2px 0;}

  .grouplabel{font-size:12px; font-weight:700; color:var(--sub); margin:12px 2px 6px; letter-spacing:.5px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    border:1.5px solid #d8dde3; background:#fff; color:#3d444c; border-radius:16px;
    padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer; min-height:34px;
  }
  .chip[aria-pressed="true"]{background:var(--navy); border-color:var(--navy); color:#fff;}
  .chip .n{opacity:.6; font-weight:400; margin-left:3px; font-size:11.5px;}
  .chip.more{border-style:dashed; color:var(--sub);}

  .switchrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; align-items:center;}
  .toggle{display:inline-flex; align-items:center; gap:7px; font-size:13.5px; font-weight:600;
    background:#f4f6f8; border:1.5px solid #dfe4e9; border-radius:10px; padding:8px 12px;
    min-height:var(--tap); cursor:pointer; user-select:none;}
  .toggle input{width:18px; height:18px; accent-color:var(--green); margin:0;}
  .seg{display:inline-flex; border:1.5px solid #dfe4e9; border-radius:10px; overflow:hidden; background:#f4f6f8;}
  .seg button{border:0; background:transparent; padding:9px 14px; font-size:13.5px; font-weight:700;
    color:var(--sub); cursor:pointer; min-height:var(--tap);}
  .seg button[aria-pressed="true"]{background:var(--navy); color:#fff;}

  /* ---------- 統計 ---------- */
  .stats{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
    font-size:12.5px; color:var(--sub); margin:0 2px 8px;}
  .bar{height:7px; background:#e3e7eb; border-radius:4px; overflow:hidden; margin:6px 2px 14px;}
  .bar span{display:block; height:100%; background:var(--green); width:0; transition:width .25s;}

  /* ---------- 清單本體 ---------- */
  .cityhead{
    display:flex; align-items:baseline; gap:8px; margin:18px 2px 8px;
    font-size:15.5px; font-weight:800; color:var(--navy);
    border-bottom:2px solid var(--navy); padding-bottom:5px;
  }
  .cityhead .n{font-size:12px; font-weight:500; color:var(--sub);}

  .store{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px;}
  .store.allDone{background:#f7f8f9; border-color:#e9ecef;}
  .storetop{display:flex; gap:8px; align-items:flex-start; justify-content:space-between;}
  .sname{font-size:15px; font-weight:800; color:#1b1f24; margin:0; word-break:break-word;}
  .smeta{font-size:11.5px; color:var(--sub); margin:3px 0 0;}
  .smeta .oa{font-variant-numeric:tabular-nums;}
  .oabtn{
    flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    min-height:34px; padding:6px 10px; border-radius:9px; border:1.5px solid var(--green);
    color:var(--green-d); background:#f0fbf4; font-size:12px; font-weight:800; text-decoration:none; white-space:nowrap;
  }
  .storebar{display:flex; gap:8px; align-items:center; justify-content:space-between; margin-top:8px;}
  .storeprog{font-size:11.5px; color:var(--sub);}
  .minibtn{border:1.5px solid #dfe4e9; background:#fff; color:var(--sub); border-radius:9px;
    padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer; min-height:34px;}

  ul.items{list-style:none; margin:8px 0 0; padding:0;}
  ul.items li{display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid #eef1f4;}
  .pname{flex:1 1 auto; min-width:0; font-size:14px; word-break:break-word;}
  .code{
    display:inline-block; font-size:10.5px; font-weight:800; color:#3b5b86; background:#eaf1fa;
    border-radius:5px; padding:1px 5px; margin-right:6px; vertical-align:1px; letter-spacing:.3px;
  }
  .go{
    flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    min-width:66px; min-height:var(--tap); padding:0 14px; border-radius:10px;
    background:var(--green); color:#fff; font-size:13.5px; font-weight:800;
    text-decoration:none; white-space:nowrap;
  }
  .go:active{background:var(--green-d);}
  .mark{
    flex:0 0 auto; width:var(--tap); height:var(--tap); border-radius:10px;
    border:1.5px solid #dfe4e9; background:#fff; color:#b9c0c7;
    font-size:17px; font-weight:800; cursor:pointer; line-height:1;
  }
  li.done .pname{color:var(--gray); text-decoration:line-through; text-decoration-color:#cfd5db;}
  li.done .code{background:#eef0f2; color:#98a1a9;}
  li.done .go{background:var(--gray);}
  li.done .mark{background:var(--gray); border-color:var(--gray); color:#fff;}
  li.stale .go{background:#7ec99b;}
  .agotag{font-size:10.5px; color:var(--warn); margin-left:6px; white-space:nowrap;}

  .empty{text-align:center; color:var(--sub); padding:34px 12px; background:var(--card);
    border:1px dashed #d6dbe0; border-radius:14px;}

  /* ---------- 清單分頁 ---------- */
  textarea.out{
    width:100%; min-height:320px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:12.5px; line-height:1.6; border:1.5px solid #d3d8de; border-radius:10px; padding:10px;
    background:#fff; color:var(--txt); resize:vertical;
  }
  .btnrow{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
  .btn{border:0; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:800;
    cursor:pointer; min-height:var(--tap); background:var(--navy); color:#fff; text-decoration:none;
    display:inline-flex; align-items:center;}
  .btn.ghost{background:#fff; color:var(--navy); border:1.5px solid var(--navy);}
  .btn.danger{background:#fff; color:#c92a2a; border:1.5px solid #f3bcbc;}
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translate(-50%,14px); z-index:60;
    background:#22262b; color:#fff; padding:11px 18px; border-radius:22px; font-size:13.5px;
    font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
    max-width:88vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  /* ---------- 說明 ---------- */
  .doc h2{font-size:14.5px; color:var(--navy); margin:18px 0 6px;}
  .doc ol,.doc ul{margin:6px 0 0; padding-left:20px;}
  .doc li{margin:4px 0; font-size:13.5px;}
  .doc code{background:#eef1f4; padding:1px 5px; border-radius:4px; font-size:12.5px;}
  .warnbox{background:#fff8e6; border:1px solid #ffe08a; border-radius:10px; padding:10px 12px;
    font-size:13px; color:#7a5200; margin:10px 0;}

  /* ---------- 底部固定條 ---------- */
  .fixbar{
    position:fixed; left:0; right:0; bottom:0; z-index:50; background:rgba(255,255,255,.97);
    border-top:1px solid var(--line); padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    backdrop-filter:saturate(150%) blur(6px);
  }
  .fixbar .inner{max-width:820px; margin:0 auto; display:flex; gap:8px; align-items:center; justify-content:space-between;}
  .fixbar .txt{font-size:12.5px; color:var(--sub); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fixbar .btn{padding:9px 14px; font-size:13px;}
  [hidden]{display:none !important;}
  @media print{
    header,nav.tabs,.panel,.fixbar,.btnrow,.bar,.toast{display:none !important;}
    body{background:#fff; padding:0;}
    .store{break-inside:avoid; border:1px solid #ccc;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Funbox 陀螺抽選 · 連結整理</h1>
    <p class="notice" id="notice"></p>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-links"  aria-selected="true"  data-tab="links">抽選連結</button>
    <button role="tab" id="tab-list"   aria-selected="false" data-tab="list">產生清單</button>
    <button role="tab" id="tab-friend" aria-selected="false" data-tab="friend">加好友</button>
  </nav>

  <!-- ===================== 抽選連結 ===================== -->
  <section id="pane-links" role="tabpanel">
    <div class="panel">
      <div class="searchrow">
        <input id="q" class="search" type="search" inputmode="search" autocomplete="off"
               placeholder="搜尋商品或門市，例如 UX-21、獅鷲、忠孝" aria-label="搜尋商品或門市" />
        <button id="qclear" class="clearbtn" type="button" aria-label="清除搜尋">×</button>
      </div>
      <p class="hint">打型號（<b>UX-21</b>）就會列出全台有這支的門市；打門市名（<b>忠孝</b>）就只看那間。</p>

      <div class="grouplabel">縣市</div>
      <div class="chips" id="cityChips"></div>

      <div class="grouplabel" id="timeLabel">開始時間</div>
      <div class="chips" id="timeChips"></div>

      <div class="grouplabel">商品型號</div>
      <div class="chips" id="codeChips"></div>

      <div class="switchrow">
        <div class="seg" role="group" aria-label="分組方式">
          <button type="button" data-view="store" aria-pressed="true">依門市</button>
          <button type="button" data-view="code"  aria-pressed="false">依商品</button>
        </div>
        <label class="toggle"><input type="checkbox" id="hideDone" /> 只看今天還沒抽的</label>
        <button type="button" class="minibtn" id="resetFilter">重設篩選</button>
      </div>
    </div>

    <div class="stats">
      <span id="countTxt"></span>
      <span id="doneTxt"></span>
    </div>
    <div class="bar"><span id="barFill"></span></div>

    <div id="list"></div>
  </section>

  <!-- ===================== 產生清單 ===================== -->
  <section id="pane-list" role="tabpanel" hidden>
    <div class="panel">
      <p class="hint" style="margin-top:0">
        清單內容 = <b>「抽選連結」分頁目前的篩選結果</b>。先在那邊挑好縣市／型號，再回來這裡複製或下載。
      </p>
      <div class="switchrow">
        <div class="seg" role="group" aria-label="清單格式">
          <button type="button" data-fmt="txt" aria-pressed="true">文字</button>
          <button type="button" data-fmt="md"  aria-pressed="false">Markdown</button>
          <button type="button" data-fmt="csv" aria-pressed="false">CSV</button>
        </div>
        <label class="toggle"><input type="checkbox" id="listSkipDone" checked /> 排除今天已抽</label>
        <label class="toggle"><input type="checkbox" id="listOa" /> 附加好友連結</label>
      </div>
      <div class="btnrow">
        <button class="btn" id="copyBtn" type="button">複製全部</button>
        <button class="btn ghost" id="dlBtn" type="button">下載檔案</button>
        <button class="btn ghost" id="printBtn" type="button">列印 / 存 PDF</button>
      </div>
      <textarea class="out" id="out" readonly spellcheck="false" aria-label="清單內容"></textarea>
    </div>
  </section>

  <!-- ===================== 加好友 ===================== -->
  <section id="pane-friend" role="tabpanel" hidden>
    <div class="panel">
      <p class="hint" style="margin-top:0">
        抽選前要先加該門市的 LINE 官方帳號好友，否則點抽獎連結會進不去。這裡是各門市帳號，點過會變灰。
      </p>
      <div class="searchrow">
        <input id="fq" class="search" type="search" autocomplete="off"
               placeholder="搜尋門市，例如 忠孝、台中" aria-label="搜尋門市" />
        <button id="fqclear" class="clearbtn" type="button" aria-label="清除搜尋">×</button>
      </div>
    </div>
    <div id="friendList"></div>
  </section>

</div>

<div class="fixbar" id="fixbar">
  <div class="inner">
    <span class="txt" id="fixTxt"></span>
    <button class="btn" id="gotoList" type="button">產生清單</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

var mem = {};

  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
  catch(e){ return false; }
})();
function lsGet(k){
  if(!lsOK) return mem[k] || null;
  try { return localStorage.getItem(k); } catch(e){ return null; }
}
function lsSet(k,v){
  if(!lsOK){ mem[k]=v; return; }

}

/* ---------- 小工具 ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function todayStr(d){
  d = d || new Date();
  var m = d.getMonth()+1, day = d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;
}
function shortDate(iso){
  var p = String(iso||"").split("-");
  return p.length === 3 ? (Number(p[1])+"/"+Number(p[2])) : iso;
}

  STORES.forEach(function(s){
    if(!cSeen[s.city]){ cSeen[s.city] = 0; CITIES.push(s.city); }

  var parts = q.toLowerCase().split(/\s+/).filter(Boolean);
  for(var i=0;i<parts.length;i++){ if(hay.indexOf(parts[i]) === -1) return false; }
  return true;

  var show = state.codesExpanded ? CODES.slice() : CODES.slice(0, LIMIT);
  // 已選但被折疊藏起來的，也要顯示出來，不然看不到自己選了什麼
  CODES.forEach(function(c){ if(state.codes[c] && show.indexOf(c) === -1) show.push(c); });
  var html = '<button class="chip" data-code="*" aria-pressed="' + (!anyOn(state.codes)) + '">全部<span class="n">' + CODES.length + '</span></button>' +
    show.map(function(c){
      return '<button class="chip" data-code="' + esc(c) + '" aria-pressed="' + (!!state.codes[c]) + '">' +
             esc(c) + '<span class="n">' + CODE_COUNT[c] + '</span></button>';
    }).join("");
  if(CODES.length > LIMIT){
    html += '<button class="chip more" data-code="__toggle">' +
            (state.codesExpanded ? "收合 ▲" : "全部型號 ▼") + '</button>';
  }
  kc.innerHTML = html;
}

/* ---------- 畫主清單 ---------- */
function itemRowHtml(store, it){
  var k = itemKey(store, it);
  var dd = doneDate(k);
  var cls = dd === TODAY ? " done" : (dd ? " stale" : "");
  var code = it.c ? '<span class="code">' + esc(it.c) + '</span>' : "";
  // 商品名稱常已含型號，重複就不再加 badge
  var showCode = it.c && it.p.toUpperCase().indexOf(it.c) !== 0 ? code : "";
  var ago = (dd && dd !== TODAY) ? '<span class="agotag">前次 ' + esc(shortDate(dd)) + '</span>' : "";
  return '<li class="' + cls.trim() + '" data-k="' + esc(k) + '">' +
    '<span class="pname">' + showCode + esc(it.p) + ago + '</span>' +
    '<a class="go" href="' + esc(it.u) + '" target="_blank" rel="noopener" data-go="' + esc(k) + '">抽選</a>' +
    '<button class="mark" type="button" data-mark="' + esc(k) + '" ' +
      'aria-pressed="' + (dd === TODAY) + '" ' +
      'aria-label="' + (dd === TODAY ? "取消今天已抽記錄" : "標記今天抽過了") + '" title="標記今天抽過了">✓</button>' +
  '</li>';
}

function storeCardHtml(store, items, showCity){
  var totalDone = 0;
  items.forEach(function(it){ if(isToday(itemKey(store, it))) totalDone++; });
  var all = items.length && totalDone === items.length;
  var oa = store.oaUrl
    ? '<a class="oabtn" href="' + esc(store.oaUrl) + '" target="_blank" rel="noopener" data-oa="' + esc(store.oa||"") + '">＋好友</a>'
    : "";
  return '<div class="store' + (all ? " allDone" : "") + '" data-store="' + esc(store.name) + '">' +
    '<div class="storetop"><div>' +
      '<p class="sname">' + (showCity ? '<span class="code">' + esc(store.city) + '</span>' : "") + esc(store.name) + '</p>' +
      '<p class="smeta">抽選時間：' + esc(store.time || "—") +
        (store.oa ? ' · <span class="oa">' + esc(store.oa) + '</span>' : "") + '</p>' +
    '</div>' + oa + '</div>' +
    '<div class="storebar">' +
      '<span class="storeprog">今天 ' + totalDone + ' / ' + items.length + ' 已抽</span>' +
      '<button class="minibtn" type="button" data-allstore="' + esc(store.name) + '">' +
        (all ? "整間取消標記" : "整間標記已抽") + '</button>' +
    '</div>' +
    '<ul class="items">' + items.map(function(it){ return itemRowHtml(store, it); }).join("") + '</ul>' +
  '</div>';
}

function render(){
  var groups = filtered();
  var host = document.getElementById("list");
  var nStores = groups.length, nItems = 0, nDone = 0;
  groups.forEach(function(g){
    nItems += g.items.length;
    g.items.forEach(function(it){ if(isToday(itemKey(g.store, it))) nDone++; });
  });

  var html = "";
  if(!nItems){
    html = '<div class="empty">找不到符合的項目。<br>試著清空搜尋或按「重設篩選」。</div>';
  } else if(state.view === "store"){
    var order = [], byCity = {};
    groups.forEach(function(g){
      if(!byCity[g.store.city]){ byCity[g.store.city] = []; order.push(g.store.city); }
      byCity[g.store.city].push(g);
    });
    order.forEach(function(city){
      var gs = byCity[city], n = 0;
      gs.forEach(function(g){ n += g.items.length; });
      html += '<div class="cityhead">' + esc(city) +
              '<span class="n">' + gs.length + ' 間 · ' + n + ' 項</span></div>';
      gs.forEach(function(g){ html += storeCardHtml(g.store, g.items, false); });
    });
  } else {
    // 依商品：型號 -> 各門市
    var byCode = {}, corder = [];
    groups.forEach(function(g){
      g.items.forEach(function(it){
        var c = it.c || "其他";
        if(!byCode[c]){ byCode[c] = []; corder.push(c); }
        byCode[c].push({ store: g.store, item: it });
      });
    });
    corder.sort(function(a,b){ return CODES.indexOf(a) - CODES.indexOf(b); });
    corder.forEach(function(c){
      var rows = byCode[c];
      html += '<div class="cityhead">' + esc(c) + '<span class="n">' + rows.length + ' 間門市</span></div>';
      html += '<div class="store">' +
        '<ul class="items" style="margin-top:0">' +
        rows.map(function(r){
          var k = itemKey(r.store, r.item);
          var dd = doneDate(k);
          var cls = dd === TODAY ? " done" : (dd ? " stale" : "");
          var ago = (dd && dd !== TODAY) ? '<span class="agotag">前次 ' + esc(shortDate(dd)) + '</span>' : "";
          return '<li class="' + cls.trim() + '" data-k="' + esc(k) + '">' +
            '<span class="pname"><span class="code">' + esc(r.store.city) + '</span>' +
              esc(r.store.name) + ago +
              '<br><span style="font-size:11.5px;color:var(--sub)">' + esc(r.item.p) + '</span></span>' +
            '<a class="go" href="' + esc(r.item.u) + '" target="_blank" rel="noopener" data-go="' + esc(k) + '">抽選</a>' +
            '<button class="mark" type="button" data-mark="' + esc(k) + '" aria-pressed="' + (dd === TODAY) + '" ' +
              'aria-label="標記今天抽過了" title="標記今天抽過了">✓</button>' +
          '</li>';
        }).join("") +
        '</ul></div>';
    });
  }
  host.innerHTML = html;

  document.getElementById("countTxt").textContent = "顯示 " + nStores + " 間門市 · " + nItems + " 個抽選項目";
  document.getElementById("doneTxt").textContent  = "今天已抽 " + nDone + " / " + nItems;
  var pct = nItems ? Math.round(nDone / nItems * 100) : 0;
  document.getElementById("barFill").style.width = pct + "%";
  document.getElementById("fixTxt").textContent = nItems
    ? ("目前篩選 " + nItems + " 項，還沒抽 " + (nItems - nDone) + " 項")
    : "目前沒有符合的項目";

  buildOutput();
}

/* ---------- 產生清單文字 ---------- */
function buildOutput(){
  var skip = document.getElementById("listSkipDone").checked;
  var withOa = document.getElementById("listOa").checked;
  var groups = filtered();
  var lines = [], rows = 0;
  var fmt = state.fmt;

  if(fmt === "csv"){
    lines.push("縣市,門市,抽選時間,商品,連結" + (withOa ? ",官方帳號連結" : ""));
  } else {
    var head = "Funbox 抽選清單（" + TODAY + "）";
    lines.push(fmt === "md" ? "# " + head : head);
    if(DATA && DATA.notice) lines.push((fmt === "md" ? "> " : "") + DATA.notice);
    lines.push("");
  }

  groups.forEach(function(g){
    var items = g.items.filter(function(it){ return !(skip && isToday(itemKey(g.store, it))); });
    if(!items.length) return;
    if(fmt === "csv"){
      items.forEach(function(it){
        rows++;
        lines.push([g.store.city, g.store.name, g.store.time, it.p, it.u]
          .concat(withOa ? [g.store.oaUrl || ""] : [])
          .map(csvCell).join(","));
      });
    } else if(fmt === "md"){
      lines.push("## " + g.store.city + " / " + g.store.name);
      lines.push("- 抽選時間：" + (g.store.time || "—"));
      if(withOa && g.store.oaUrl) lines.push("- 加好友：" + g.store.oaUrl);
      items.forEach(function(it){ rows++; lines.push("- [ ] [" + it.p + "](" + it.u + ")"); });
      lines.push("");
    } else {
      lines.push("【" + g.store.city + "】" + g.store.name + "（" + (g.store.time || "—") + "）");
      if(withOa && g.store.oaUrl) lines.push("  加好友 " + g.store.oaUrl);
      items.forEach(function(it){ rows++; lines.push("  □ " + it.p + "\n    " + it.u); });
      lines.push("");
    }
  });

  if(!rows){
    lines = [fmt === "csv" ? "縣市,門市,抽選時間,商品,連結" : "（目前條件下沒有要抽的項目）"];
  } else if(fmt !== "csv"){
    lines.push("— 共 " + rows + " 項 —");
  }
  document.getElementById("out").value = lines.join("\n");
  window.__rows = rows;
}
function csvCell(v){
  v = String(v == null ? "" : v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
}

/* ---------- 加好友清單 ---------- */
function renderFriends(){
  var q = (document.getElementById("fq").value || "").trim().toLowerCase();
  var seen = {}, byRegion = {}, order = [];
  ACCOUNTS.forEach(function(a){
    if(!a.u) return;
    var dedup = a.region + "|" + a.name + "|" + a.id;
    if(seen[dedup]) return;
    seen[dedup] = 1;
    if(q && (a.region + " " + a.name + " " + a.id).toLowerCase().indexOf(q) === -1) return;
    if(!byRegion[a.region]){ byRegion[a.region] = []; order.push(a.region); }
    byRegion[a.region].push(a);
  });
  var html = "";
  var total = 0;
  order.forEach(function(r){
    html += '<div class="cityhead">' + esc(r) + '<span class="n">' + byRegion[r].length + ' 間</span></div>';
    html += '<div class="store"><ul class="items" style="margin-top:0">' +
      byRegion[r].map(function(a){
        total++;
        var d = oaHas(a.id) ? " done" : "";
        return '<li class="' + d.trim() + '">' +
          '<span class="pname">' + esc(a.name) +
            '<br><span style="font-size:11.5px;color:var(--sub)">' + esc(a.id) + '</span></span>' +
          '<a class="go" href="' + esc(a.u) + '" target="_blank" rel="noopener" data-oa="' + esc(a.id) + '">加好友</a>' +
        '</li>';
      }).join("") + '</ul></div>';
  });
  document.getElementById("friendList").innerHTML =
    total ? html : '<div class="empty">找不到符合的門市。</div>';
}

/* ---------- 事件 ---------- */
function switchTab(name){
  ["links","list","friend"].forEach(function(n){
    document.getElementById("tab-" + n).setAttribute("aria-selected", String(n === name));
    document.getElementById("pane-" + n).hidden = (n !== name);
  });
  document.getElementById("fixbar").hidden = (name !== "links");
  if(name === "friend") renderFriends();
  if(name === "list") buildOutput();
  window.scrollTo(0, 0);
}
document.querySelector("nav.tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-tab]");
  if(b) switchTab(b.getAttribute("data-tab"));
});
document.getElementById("gotoList").addEventListener("click", function(){ switchTab("list"); });

var qEl = document.getElementById("q");
var qTimer = null;
qEl.addEventListener("input", function(){
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){ state.q = qEl.value.trim(); render(); }, 140);
});
document.getElementById("qclear").addEventListener("click", function(){
  qEl.value = ""; state.q = ""; render(); qEl.focus();
});
document.getElementById("fq").addEventListener("input", renderFriends);
document.getElementById("fqclear").addEventListener("click", function(){
  document.getElementById("fq").value = ""; renderFriends();
});

document.getElementById("cityChips").addEventListener("click", function(e){
  var b = e.target.closest("button[data-city]");
  if(!b) return;
  var c = b.getAttribute("data-city");
  if(c === "*") state.cities = {};
  else state.cities[c] = !state.cities[c];
  renderChips(); render();
});
document.getElementById("timeChips").addEventListener("click", function(e){
  var b = e.target.closest("button[data-time]");
  if(!b) return;
  var t = b.getAttribute("data-time");
  if(t === "*") state.times = {};
  else state.times[t] = !state.times[t];
  renderChips(); render();
});
document.getElementById("codeChips").addEventListener("click", function(e){
  var b = e.target.closest("button[data-code]");
  if(!b) return;
  var c = b.getAttribute("data-code");
  if(c === "__toggle"){ state.codesExpanded = !state.codesExpanded; renderChips(); return; }
  if(c === "*") state.codes = {};
  else state.codes[c] = !state.codes[c];
  renderChips(); render();
});
document.querySelector('.seg[aria-label="分組方式"]').addEventListener("click", function(e){
  var b = e.target.closest("button[data-view]");
  if(!b) return;
  state.view = b.getAttribute("data-view");
  this.querySelectorAll("button").forEach(function(x){
    x.setAttribute("aria-pressed", String(x === b));
  });
  render();
});
document.querySelector('.seg[aria-label="清單格式"]').addEventListener("click", function(e){
  var b = e.target.closest("button[data-fmt]");
  if(!b) return;
  state.fmt = b.getAttribute("data-fmt");
  this.querySelectorAll("button").forEach(function(x){
    x.setAttribute("aria-pressed", String(x === b));
  });
  buildOutput();
});
document.getElementById("hideDone").addEventListener("change", function(){
  state.hideDone = this.checked; render();
});
document.getElementById("resetFilter").addEventListener("click", function(){
  state.q = ""; qEl.value = ""; state.cities = {}; state.times = {}; state.codes = {};
  state.hideDone = false; document.getElementById("hideDone").checked = false;
  renderChips(); render(); toast("已重設篩選");
});
document.getElementById("listSkipDone").addEventListener("change", buildOutput);
document.getElementById("listOa").addEventListener("change", buildOutput);

/* 主清單：抽選（自動標記）、✓ 手動標記、整間標記、加好友 */
document.getElementById("list").addEventListener("click", function(e){
  var go = e.target.closest("a[data-go]");
  if(go){
    var k = go.getAttribute("data-go");
    if(!isToday(k)){
      setDone(k, true);
      var li = go.closest("li");
      if(li){
        li.classList.remove("stale"); li.classList.add("done");
        var mk = li.querySelector("[data-mark]");
        if(mk) mk.setAttribute("aria-pressed","true");
      }
      refreshStats();
    }
    return; // 讓連結照正常開啟
  }
  var mk = e.target.closest("button[data-mark]");
  if(mk){
    var key = mk.getAttribute("data-mark");
    var on = !isToday(key);
    setDone(key, on);
    render();
    toast(on ? "已標記今天抽過了" : "已取消標記");
    return;
  }
  var as = e.target.closest("button[data-allstore]");
  if(as){
    var sname = as.getAttribute("data-allstore");
    var card = as.closest(".store");
    var keys = [];
    card.querySelectorAll("li[data-k]").forEach(function(li){ keys.push(li.getAttribute("data-k")); });
    var allOn = keys.length > 0 && keys.every(isToday);
    keys.forEach(function(k2){ setDone(k2, !allOn); });
    render();
    toast(allOn ? ("已取消「" + sname + "」全部標記") : ("「" + sname + "」整間標記完成"));
    return;
  }
  var oa = e.target.closest("a[data-oa]");
  if(oa){ oaAdd(oa.getAttribute("data-oa")); }
});
document.getElementById("friendList").addEventListener("click", function(e){
  var oa = e.target.closest("a[data-oa]");
  if(!oa) return;
  oaAdd(oa.getAttribute("data-oa"));
  var li = oa.closest("li");
  if(li) li.classList.add("done");
});

function refreshStats(){
  var groups = filtered(), nItems = 0, nDone = 0;
  groups.forEach(function(g){
    nItems += g.items.length;
    g.items.forEach(function(it){ if(isToday(itemKey(g.store, it))) nDone++; });
  });
  document.getElementById("doneTxt").textContent = "今天已抽 " + nDone + " / " + nItems;
  document.getElementById("barFill").style.width = (nItems ? Math.round(nDone/nItems*100) : 0) + "%";
  document.getElementById("fixTxt").textContent = nItems
    ? ("目前篩選 " + nItems + " 項，還沒抽 " + (nItems - nDone) + " 項") : "目前沒有符合的項目";
  buildOutput();
}

/* 複製 / 下載 / 列印 */
document.getElementById("copyBtn").addEventListener("click", function(){
  var ta = document.getElementById("out");
  function fallback(){
    ta.removeAttribute("readonly");
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch(e){}
    ta.setAttribute("readonly","readonly");
    toast(ok ? "已複製清單" : "複製失敗，請長按文字框手動複製");
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(function(){ toast("已複製清單"); }, fallback);
  } else fallback();
});
document.getElementById("dlBtn").addEventListener("click", function(){
  var ext = state.fmt === "csv" ? "csv" : (state.fmt === "md" ? "md" : "txt");
  var mime = state.fmt === "csv" ? "text/csv" : "text/plain";
  var text = document.getElementById("out").value;
  // CSV 加 BOM，Excel 才不會把中文變亂碼
  var parts = state.fmt === "csv" ? ["\ufeff", text] : [text];
  var blob = new Blob(parts, { type: mime + ";charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "funbox-抽選清單-" + TODAY + "." + ext;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  toast("已下載");
});
document.getElementById("printBtn").addEventListener("click", function(){
  switchTab("links");
  setTimeout(function(){ window.print(); }, 120);
});

/* 日期跨天：回到前景時重新檢查，避免昨天的灰色殘留 */
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState !== "visible") return;
  var t = todayStr();
  if(t !== TODAY){ TODAY = t; render(); toast("已跨日，記錄重新計算"); }
});

/* ---------- 起始 ---------- */
(function init(){
  var n = document.getElementById("notice");
  var stat = STORES.length + " 間門市 · " +
    STORES.reduce(function(a,s){ return a + s.items.length; }, 0) + " 個抽選項目";
  n.innerHTML = (DATA && DATA.notice ? "<b>" + esc(DATA.notice) + "</b> · " : "") + esc(stat) +
                " · 資料 " + esc((DATA && DATA.builtAt) || "");
  if(!lsOK){
    toast("這個瀏覽器不能存記錄，關掉頁面就會消失");
  }
  renderChips();
  render();
})();
